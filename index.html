<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dividir la cuenta</title>
<meta name="description" content="Apunta el ticket, pasa el enlace y cada uno marca lo que ha tomado.">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<style>
:root{--fondo:#f4f6f5;--tarjeta:#fff;--texto:#17201d;--suave:#66736e;--linea:#e2e7e5;--prim:#0f766e;--prim-t:#fff;--mio:#e3f4f1;--chip:#eef1f0;--alerta:#b45309;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--fondo:#0f1412;--tarjeta:#18201d;--texto:#e7eeeb;--suave:#93a19b;--linea:#2a3531;--prim:#2dd4bf;--prim-t:#06201c;--mio:#123631;--chip:#24302c;--alerta:#f59e0b;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
header h1{font-size:1.3rem;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atras{font-size:2rem;line-height:1;text-decoration:none;color:var(--texto);padding:0 6px}
h2{font-size:1.05rem;margin:0 0 10px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:14px;margin:12px 0}
.cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.cab h2{margin:0}
.suave{color:var(--suave)}.peq{font-size:.85rem}.centro{text-align:center}
a{color:var(--prim)}
label{display:block;margin:10px 0;font-size:.9rem;color:var(--suave)}
label.fila{display:flex;align-items:center;gap:8px;justify-content:space-between}
label.fila input[type=checkbox]{width:20px;height:20px;order:-1}
input{font:inherit;color:var(--texto);background:var(--fondo);border:1px solid var(--linea);border-radius:10px;padding:10px;width:100%;min-width:0}
label > input:not([type=checkbox]){margin-top:4px}
label.fila > input{width:auto;flex:0 1 160px;margin:0}
button{font:inherit;cursor:pointer}
.btn,.prim{border-radius:12px;padding:10px 14px;border:1px solid var(--linea);background:var(--tarjeta);color:var(--texto);text-decoration:none;display:inline-block}
.prim{background:var(--prim);color:var(--prim-t);border-color:var(--prim);font-weight:600}
.btn.prim{background:var(--prim);color:var(--prim-t)}
.peq.btn{padding:6px 10px;font-size:.85rem}
.ancho{width:100%;margin-top:10px}
.filaBtns{display:flex;gap:8px;margin-top:10px}.filaBtns>*{flex:1}
.reciente{display:flex;justify-content:space-between;padding:12px 2px;border-top:1px solid var(--linea);text-decoration:none;color:var(--texto)}
.platos{list-style:none;margin:0;padding:0}
.plato{border-top:1px solid var(--linea);padding:10px 4px}
.plato:first-child{border-top:0}
.plato.mio{background:var(--mio);border-radius:12px;border-color:transparent}
.plato.mio + .plato{border-color:transparent}
.pp{display:flex;justify-content:space-between;gap:10px;cursor:pointer;user-select:none;padding:4px 0}
.pp .nom{font-weight:500}.uds{color:var(--suave);margin-right:4px}
.pre{font-variant-numeric:tabular-nums;white-space:nowrap}
.plato.libre .pp .nom::after{content:" · sin marcar";color:var(--alerta);font-size:.8rem;font-weight:400}
.quien{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.chip{background:var(--chip);border-radius:99px;padding:2px 9px;font-size:.8rem}
.chip.yo{background:var(--prim);color:var(--prim-t)}.chip.todos{background:var(--prim);color:var(--prim-t)}
.mas{display:inline-flex;gap:4px}.mas button{width:32px;height:28px;border-radius:8px;border:1px solid var(--linea);background:var(--tarjeta);color:var(--texto)}
.enlace{background:none;border:0;color:var(--suave);font-size:.78rem;text-decoration:underline;margin-left:auto;padding:4px}
.vacio{color:var(--suave);padding:12px 0}
.plato.ed{display:flex;gap:6px;align-items:center}
.nuevo{display:flex;gap:6px;margin-top:10px}
.n{flex:0 0 46px;text-align:center}.nom{flex:1}input.pre{flex:0 0 86px;text-align:right}
.x{background:none;border:0;color:var(--suave);font-size:1.1rem;padding:6px}
.edicion{border-bottom:1px dashed var(--linea);padding-bottom:10px;margin-bottom:6px}
.resumen{list-style:none;margin:0;padding:0}
.resumen li{display:flex;justify-content:space-between;padding:9px 2px;border-top:1px solid var(--linea);font-variant-numeric:tabular-nums}
.resumen li:first-child{border-top:0}.resumen li.yo{font-weight:700}
.resumen small{color:var(--suave);font-weight:400;margin-left:4px}
.totales{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--suave);font-size:.85rem;margin-top:8px}
.alerta{color:var(--alerta)}.ok{color:var(--ok)}
.personas{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.sinred{display:none;background:var(--alerta);color:#fff;border-radius:10px;padding:6px 10px;font-size:.85rem;text-align:center}.sinred.ver{display:block}
.fondo{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.ventana{background:var(--tarjeta);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.leidos{list-style:none;margin:0;padding:0}.leidos label{display:flex;gap:8px;align-items:center;color:var(--texto);margin:0;padding:8px 0;border-top:1px solid var(--linea)}.leidos span{flex:1}
.barra{height:6px;background:var(--chip);border-radius:9px;overflow:hidden}.barra i{display:block;height:100%;width:0;background:var(--prim);transition:width .2s}
#aviso{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--texto);color:var(--fondo);padding:10px 16px;border-radius:12px;transition:transform .2s,visibility .2s;z-index:10;max-width:90vw;visibility:hidden}
#aviso.ver{transform:translate(-50%,0);visibility:visible}
</style>
</head>
<body>
<main id="app"></main>
<div id="aviso" role="status"></div>
<script src="calculo.js"></script>
<script src="app.js"></script>
</body>
</html>
